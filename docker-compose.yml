
services:
  postgres:
    image: postgres:15-alpine
    container_name: onboarding_db
    environment:
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding_pass
      POSTGRES_DB: onboarding_hub
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: onboarding_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@onboarding.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  pg_data:
